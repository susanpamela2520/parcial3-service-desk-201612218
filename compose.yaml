name: catalogo-servicios

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-catalogo}
      POSTGRES_USER: ${POSTGRES_USER:-catalogo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb-test.sql:/docker-entrypoint-initdb.d/10-test.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-catalogo}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-catalogo}
      DATABASE_URL_TEST: postgresql+psycopg://${POSTGRES_USER:-catalogo}:${POSTGRES_PASSWORD}@db:5432/catalogo_test
      DEMO_ADMIN_USUARIO: ${DEMO_ADMIN_USUARIO:-admin}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
      DEMO_CONSULTA_USUARIO: ${DEMO_CONSULTA_USUARIO:-consulta}
      DEMO_CONSULTA_PASSWORD: ${DEMO_CONSULTA_PASSWORD:-}
      DEMO_USUARIOS_PASSWORD: ${DEMO_USUARIOS_PASSWORD:-}
      CMDB_SEMILLA: ${CMDB_SEMILLA:-2026}
      CMDB_CANTIDAD: ${CMDB_CANTIDAD:-5000}
      SESSION_HOURS: ${SESSION_HOURS:-8}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      # el Excel original se monta en solo lectura: la app no puede modificarlo
      - ./data:/app/data:ro
    restart: unless-stopped

volumes:
  pgdata:
